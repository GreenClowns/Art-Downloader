name: build

# Builds the Windows app (installer + portable ZIP) and the Linux AppImage.
# Every push to main produces test builds (Actions → build → Artifacts).
# Publishing a GitHub Release with a tag like v1.2.3 builds that version and
# attaches all files to the release.
#
# Security: the build job only has read access; only the small release job
# can write, and only for published releases. Third-party actions are
# pinned to exact commits (Dependabot keeps them up to date).

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pytest -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = "0.0.0"
          if ($env:REF_TYPE -eq "tag") {
            $v = $env:REF_NAME.TrimStart("v")
            if ($v -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tag must look like v1.2.3, got '$($env:REF_NAME)'"
            }
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Put the version into the app
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $code = @'
          import os, re, pathlib
          p = pathlib.Path("art_downloader.py")
          v = os.environ["APP_VERSION"]
          s, n = re.subn(r'^APP_VERSION = "[^"]*"', f'APP_VERSION = "{v}"', p.read_text(encoding="utf-8"), flags=re.M)
          assert n == 1
          p.write_text(s, encoding="utf-8")
          '@
          python -c $code

      - name: Build exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name ArtDownloader
          --icon assets/icon.ico
          --add-data "assets/icon.png;assets"
          --add-data "assets/icon.ico;assets"
          --collect-submodules gallery_dl
          --collect-data customtkinter
          --hidden-import PIL.ImageTk
          --hidden-import PIL._tkinter_finder
          art_downloader.py

      - name: Smoke test built-in gallery-dl
        run: |
          $code = @'
          import subprocess, sys
          exe = r"dist\ArtDownloader\ArtDownloader.exe"
          out = subprocess.run([exe, "--gallery-dl", "--version"],
                               capture_output=True, text=True, timeout=120)
          print("version:", repr(out.stdout.strip()), "rc:", out.returncode)
          assert out.returncode == 0 and out.stdout.strip(), out.stderr
          ext = subprocess.run([exe, "--gallery-dl", "--list-extractors", "deviantart"],
                               capture_output=True, text=True, timeout=120)
          assert "deviantart" in ext.stdout.lower(), ext.stdout + ext.stderr
          print("deviantart extractor: ok")
          ui = subprocess.run([exe, "--self-test"], timeout=180)
          assert ui.returncode == 0, "the window did not start"
          print("window: ok")
          '@
          python -c $code

      - name: Portable ZIP
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          Compress-Archive -Path dist\ArtDownloader -DestinationPath "dist\ArtDownloader-$($env:APP_VERSION)-portable.zip"

      - name: Installer (Inno Setup)
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$($env:APP_VERSION)" windows\installer.iss

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtDownloader-windows
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip

  linux:
    # the oldest supported runner: the AppImage then also runs on older systems
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libtk8.6 libtcl8.6 xvfb

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pytest -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          v="0.0.0"
          if [ "$REF_TYPE" = "tag" ]; then
            v="${REF_NAME#v}"
            if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Release tag must look like v1.2.3, got '$REF_NAME'" >&2
              exit 1
            fi
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: PYTHON=python bash linux/build_appimage.sh "$APP_VERSION"

      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=$(ls dist/*.AppImage)
          "$app" --gallery-dl --version
          "$app" --gallery-dl --list-extractors deviantart | grep -qi deviantart
          xvfb-run -a "$app" --self-test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtDownloader-linux
          path: dist/*.AppImage

  release:
    if: github.event_name == 'release'
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ArtDownloader-*
          merge-multiple: true
          path: dist

      - name: Attach files to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*-Setup.exe
            dist/*-portable.zip
            dist/*.AppImage
