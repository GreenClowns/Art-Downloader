name: windows

# Builds the Windows app. Every push to main produces a test build
# (Actions → windows → Artifacts). Publishing a GitHub Release with a tag
# like v1.2.3 builds that version and attaches the installer and the
# portable ZIP to the release.
#
# Security: the build job only has read access; only the small release job
# can write, and only for published releases. Third-party actions are
# pinned to exact commits (Dependabot keeps them up to date).

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pytest -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $v = "0.0.0"
          if ($env:REF_TYPE -eq "tag") {
            $v = $env:REF_NAME.TrimStart("v")
            if ($v -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tag must look like v1.2.3, got '$($env:REF_NAME)'"
            }
          }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build exe (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name ArtDownloader
          --icon assets/icon.ico
          --add-data "assets/icon.png;assets"
          --collect-submodules gallery_dl
          art_downloader.py

      - name: Smoke test built-in gallery-dl
        run: |
          $code = @'
          import subprocess, sys
          exe = r"dist\ArtDownloader\ArtDownloader.exe"
          out = subprocess.run([exe, "--gallery-dl", "--version"],
                               capture_output=True, text=True, timeout=120)
          print("version:", repr(out.stdout.strip()), "rc:", out.returncode)
          assert out.returncode == 0 and out.stdout.strip(), out.stderr
          ext = subprocess.run([exe, "--gallery-dl", "--list-extractors", "deviantart"],
                               capture_output=True, text=True, timeout=120)
          assert "deviantart" in ext.stdout.lower(), ext.stdout + ext.stderr
          print("deviantart extractor: ok")
          '@
          python -c $code

      - name: Portable ZIP
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          Compress-Archive -Path dist\ArtDownloader -DestinationPath "dist\ArtDownloader-$($env:APP_VERSION)-portable.zip"

      - name: Installer (Inno Setup)
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$($env:APP_VERSION)" windows\installer.iss

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArtDownloader-windows
          path: |
            dist/*-Setup.exe
            dist/*-portable.zip

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ArtDownloader-windows
          path: dist

      - name: Attach files to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/*-Setup.exe
            dist/*-portable.zip
